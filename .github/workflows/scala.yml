name: Scala CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'openjdk'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
      # there is no src/test/scala yet, so "sbt test" would report that nothing ran.
    - name: Compile
      run: sbt compile
